# Shape of the app secret, for reference only — never commit real values, and
# this file is not part of the kustomization.
#
# Create it with (reads LIBRARIAN_DB_PASSWORD, GOOGLE_CLIENT_ID and
# GOOGLE_CLIENT_SECRET from the environment, prompting for any that are unset;
# re-running keeps the existing secret-key-base so sessions survive):
#   just k-create-secrets
#
# Optional shared platform LLM key (the deployment tolerates its absence), added
# without putting it on the command line:
#   read -rs ANTHROPIC_API_KEY
#   kubectl patch secret librarian-secrets -n librarian --type merge --patch-file <(
#     printf '{"data":{"anthropic-api-key":"%s"}}' "$(printf %s "$ANTHROPIC_API_KEY" | base64 | tr -d '\n')")
apiVersion: v1
kind: Secret
metadata:
  name: librarian-secrets
  namespace: librarian
type: Opaque
stringData:
  db-user: "librarian"
  db-password: "CHANGE_ME_TO_A_REAL_PASSWORD"
  secret-key-base: "GENERATE_WITH_mix_phx.gen.secret"
  database-url: "ecto://librarian:CHANGE_ME_TO_A_REAL_PASSWORD@postgres:5432/librarian_prod"
  google-client-id: "CHANGE_ME_GOOGLE_OAUTH_CLIENT_ID"
  google-client-secret: "CHANGE_ME_GOOGLE_OAUTH_CLIENT_SECRET"
