apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: librarian
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Postgres 16 + pgvector on the same glibc-2.41 base as stock postgres:16
          # (avoids a collation-version mismatch). Built from k8s/postgres-pgvector/Dockerfile.
          image: registry.<your-tailnet>.ts.net:5000/postgres-pgvector:16
          # The official entrypoint starts as root to chown the data dir, then
          # drops to the postgres user (uid 999) via gosu — so no runAsNonRoot /
          # runAsUser (a fresh root-owned volume would fail initdb), and no
          # fsGroup (it makes PGDATA group-writable, which postgres rejects).
          # Keep only the capabilities that entrypoint uses; postgres itself
          # holds none once gosu switches users.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
          env:
            - name: POSTGRES_DB
              value: librarian_prod
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: db-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: db-password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: librarian
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
