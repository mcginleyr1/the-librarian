apiVersion: v1
kind: ConfigMap
metadata:
  name: librarian-config
  namespace: librarian
# Site-specific settings (PHX_HOST, ALLOWED_EMAILS) live in the librarian-site
# ConfigMap, which `just k-apply` generates from LIBRARIAN_HOST and
# ALLOWED_EMAILS in .env; the release refuses to boot without them.
data:
  PHX_SERVER: "true"
  PORT: "4000"
  POOL_SIZE: "10"
  STORAGE_PATH: "/data/librarian"
  # Optional: per-user monthly budget (cents) on the shared platform LLM key
  # (anthropic-api-key secret — see k8s/secrets.yaml)
  # PLATFORM_LLM_BUDGET_CENTS: "500"
