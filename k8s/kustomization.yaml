apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: librarian

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - app.yaml
  - networkpolicy.yaml
  - tailscale.yaml
  # secrets created via: just k-create-secrets
  # Apply with `just k-apply` (not a bare `kubectl apply -k`): it pins the
  # app image to the tag already running in the cluster and creates the
  # librarian-site ConfigMap (PHX_HOST, ALLOWED_EMAILS) from .env.
