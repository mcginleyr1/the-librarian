apiVersion: apps/v1
kind: Deployment
metadata:
  name: librarian
  namespace: librarian
spec:
  replicas: 1
  # Never two pods at once: the RWO data volume can only attach to one, and a
  # rolling overlap would run Oban cron jobs twice. rollingUpdate: null lets
  # `kubectl apply` drop the defaulted RollingUpdate params when switching.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: librarian
  template:
    metadata:
      labels:
        app: librarian
    spec:
      securityContext:
        runAsNonRoot: true
        # the image's `nobody`, numeric so the kubelet can verify it isn't root
        runAsUser: 65534
        runAsGroup: 65534
        # Lets `nobody` write the data volume on volume types with ownership
        # management (no-op for hostPath/local-path volumes)
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          # Keep untagged: `just k-apply` / `just deploy` pin both containers to
          # an immutable per-commit tag at apply time (see the Justfile).
          image: localhost:31500/the-librarian
          imagePullPolicy: IfNotPresent
          command: ["/app/bin/librarian", "eval", "Librarian.Release.migrate()"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: database-url
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: secret-key-base
          envFrom:
            - configMapRef:
                name: librarian-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: librarian
          image: localhost:31500/the-librarian
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: database-url
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: secret-key-base
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: google-client-secret
            # Shared LLM key for users without their own (capped per user by
            # PLATFORM_LLM_BUDGET_CENTS).
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: anthropic-api-key
                  optional: true
            # Keep in-BEAM embedding (EXLA CPU) single-threaded so a batch can't
            # peg every core and starve web requests. The container has spare
            # cores (below) for web/BEAM while embedding uses ~one.
            - name: XLA_FLAGS
              value: "--xla_cpu_multi_thread_eigen=false"
          envFrom:
            - configMapRef:
                name: librarian-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # STORAGE_PATH and the Bumblebee model cache (BUMBLEBEE_CACHE_DIR,
            # set in the Dockerfile) — the only persistent writable paths
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "4"
          # Boot runs migrations, then loads and compiles the embedding model
          # (downloading it on first boot) before the endpoint listens: allow
          # 5 minutes before liveness takes over.
          startupProbe:
            httpGet:
              path: /
              port: 4000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: librarian-data
        # The root filesystem is read-only; the release writes its runtime
        # sys.config to RELEASE_TMP=/tmp, and uploads/imports stage there.
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: librarian-data
  namespace: librarian
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: librarian
  namespace: librarian
spec:
  selector:
    app: librarian
  ports:
    - port: 80
      targetPort: 4000
      name: http
