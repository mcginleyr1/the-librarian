apiVersion: apps/v1
kind: Deployment
metadata:
  name: librarian
  namespace: librarian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: librarian
  template:
    metadata:
      labels:
        app: librarian
    spec:
      initContainers:
        - name: migrate
          image: localhost:31500/the-librarian:latest
          imagePullPolicy: Always
          command: ["/app/bin/librarian", "eval", "Librarian.Release.migrate()"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: database-url
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: secret-key-base
          envFrom:
            - configMapRef:
                name: librarian-config
      containers:
        - name: librarian
          image: localhost:31500/the-librarian:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: database-url
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: secret-key-base
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: google-client-secret
            # Hosted mode (all optional): billing turns on when the Stripe
            # secret key + monthly price id (configmap) are present.
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: stripe-secret-key
                  optional: true
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: stripe-webhook-secret
                  optional: true
            # Platform LLM key for subscribers without their own (capped per
            # user by PLATFORM_LLM_BUDGET_CENTS).
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librarian-secrets
                  key: anthropic-api-key
                  optional: true
            # Keep in-BEAM embedding (EXLA CPU) single-threaded so a batch can't
            # peg every core and starve web requests. The container has spare
            # cores (below) for web/BEAM while embedding uses ~one.
            - name: XLA_FLAGS
              value: "--xla_cpu_multi_thread_eigen=false"
          envFrom:
            - configMapRef:
                name: librarian-config
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "4"
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: librarian-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: librarian-data
  namespace: librarian
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: librarian
  namespace: librarian
spec:
  selector:
    app: librarian
  ports:
    - port: 80
      targetPort: 4000
      name: http
